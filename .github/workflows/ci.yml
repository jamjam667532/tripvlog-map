name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: make lint
      - run: make test
      - run: npm run build
        working-directory: frontend

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --locked
      - run: make synth

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function:
          [api_public, api_jobs, api_me, collect, observe, interpret, match, aggregate, cleanup]
    steps:
      - uses: actions/checkout@v7
      - name: Build Lambda image
        run: >
          docker build -f backend/Dockerfile
          --build-arg FUNCTION=${{ matrix.function }}
          -t tripvlog-${{ matrix.function }}:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tripvlog-${{ matrix.function }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # 로컬 에뮬레이터(RIE)는 Lambda 실행 환경에서 쓰이지 않고, 베이스 이미지에 포함돼 직접 고칠 수 없다
          skip-files: /usr/local/bin/aws-lambda-rie
          exit-code: "1"
